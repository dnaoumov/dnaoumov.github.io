<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dmitri's Hackathons</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f2f3f5;
    --muted: #9aa0ab;
    --accent: #5b8cff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #14161a;
      --muted: #5c6270;
      --accent: #3462e0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 2rem;
  }
  main {
    max-width: 640px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    margin-bottom: 0.5rem;
  }
  p.subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 2.5rem;
  }
  .projects {
    display: grid;
    gap: 1rem;
  }
  a.project {
    display: block;
    padding: 1.25rem 1.5rem;
    background: var(--card);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
    font-size: 1.1rem;
    border: 1px solid rgba(128, 128, 128, 0.2);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.project:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  a.project span.desc {
    display: block;
    font-weight: 400;
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 0.35rem;
  }
</style>
</head>
<body>
<main>
  <h1>Welcome to my hackathons</h1>
  <p class="subtitle">A collection of things built in a few days flat.</p>
  <div class="projects">
    <a class="project" href="/carGPTini/">
      CarGPTini
      <span class="desc">The perfect blend of mixology and automotive enthusiasm</span>
    </a>
    <a class="project" href="/sassy-saas/">
      Sassy SaaS
      <span class="desc">Run your own company, badly, in an incremental deckbuilder</span>
    </a>
  </div>
</main>
</body>
</html>
